<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A’s Negosyo POS</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mu:#6b7280;--bd:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2a2f37;color-scheme:dark}}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.inp{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:15px}
.mu{color:var(--mu)}
.btn{border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.ghost{border:1px solid var(--bd);background:var(--card)}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0;width:100%}}
</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const peso=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const seed=[
{id:1,sku:"SKU-001",name:"Kape 3-in-1 (box)",price:120,cost:85,stock:40,e:"☕",shopee:"SP-KAPE",lazada:"",tiktok:""},
{id:2,sku:"SKU-002",name:"Dried Mangoes 200g",price:150,cost:95,stock:25,e:"🥭",shopee:"SP-MANGO",lazada:"LZ-MANGO",tiktok:""},
{id:3,sku:"SKU-003",name:"Barong Tee",price:450,cost:260,stock:12,e:"👕",shopee:"",lazada:"",tiktok:"TT-BAR"},
{id:4,sku:"SKU-004",name:"Tote Bag Abaca",price:299,cost:150,stock:6,e:"👜",shopee:"SP-TOTE",lazada:"",tiktok:""},
{id:5,sku:"SKU-005",name:"Coco Soap",price:85,cost:40,stock:60,e:"🧼",shopee:"",lazada:"LZ-SOAP",tiktok:""},
{id:6,sku:"SKU-006",name:"Bagoong Jar",price:110,cost:70,stock:3,e:"🫙",shopee:"",lazada:"",tiktok:""}];
const defSet={name:"A’s Negosyo POS Demo Store",addr:"123 Rizal St., Quezon City",phone:"0917 000 0000",tin:"Non-VAT Reg. TIN 000-000-000-000",foot:"Salamat po! Balik kayo ulit.",accent:"#0f9d6b",qr:""};
let PLAN="free";

function Modal({children,onClose,title}){return(
<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{background:"rgba(0,0,0,.55)"}}>
<div className="card w-full sm:max-w-md max-h-[92vh] overflow-auto p-4" style={{borderRadius:"18px 18px 0 0"}}>
<div className="flex justify-between items-center mb-3"><b className="text-lg">{title}</b><button className="btn ghost" onClick={onClose}>✕</button></div>{children}</div></div>);}

const DISPOSABLE=["mailinator.com","10minutemail.com","guerrillamail.com","tempmail.com","temp-mail.org","yopmail.com","trashmail.com","throwawaymail.com","sharklasers.com","getnada.com","dispostable.com","fakeinbox.com","maildrop.cc"];
const validEmail=e=>{const m=/^[A-Za-z0-9](?:[A-Za-z0-9._%+-]*[A-Za-z0-9])?@([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})$/.exec(e);if(!m||e.includes(".."))return "Enter a valid email address.";if(DISPOSABLE.includes(m[1].toLowerCase()))return "Disposable or fake email addresses are not allowed.";return ""};
const gen8=()=>{const a=new Uint32Array(1);let x="";for(let i=0;i<8;i++){crypto.getRandomValues(a);x+=a[0]%10}return x};
const msg8=c=>`Welcome to A’s Negosyo POS! This is your 8-digit verification code: ${c}`;
const RESERVED=["admin","owner","cashier","demo","superadmin"];

function Eye({off}){return off?<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>
:<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>}

function PwField({label,value,onChange,maxLength}){const[v,setV]=useState(false);const[fo,setFo]=useState(false);const show=fo||value.length>0;
return <div><div className="text-xs mu">{label}</div><div className="relative mt-1">
<input aria-label={label} className="inp" style={{paddingRight:show?46:12}} placeholder={label} type={v?"text":"password"} maxLength={maxLength} value={value} autoComplete="off" onChange={e=>onChange(e.target.value)} onFocus={()=>setFo(true)} onBlur={()=>setFo(false)}/>
{show&&<button type="button" aria-label={v?"Hide password":"Show password"} onMouseDown={e=>e.preventDefault()} onClick={()=>setV(!v)} className="absolute right-1 top-1/2 -translate-y-1/2 px-2 py-2" style={{color:"var(--mu)"}}><Eye off={v}/></button>}</div></div>}

function Auth({role,users,setUsers,onIn}){
const[st,setSt]=useState("login");const[err,setErr]=useState("");
const[lid,setLid]=useState("");const[lpw,setLpw]=useState("");
const[ph,setPh]=useState("");const[em,setEm]=useState("");const[ch,setCh]=useState("");const[code,setCode]=useState("");const[inp,setInp]=useState("");const[bn,setBn]=useState(true);
const[un,setUn]=useState("");const[pw,setPw]=useState("");const[pw2,setPw2]=useState("");const[shop,setShop]=useState("");const[prov,setProv]=useState("");
const G={background:"#0f9d6b"};
const reset=m=>{setSt("signup");setErr(m||"");setPh("");setEm("");setCh("");setCode("");setInp("");setUn("");setPw("");setPw2("");setShop("");setProv("")};
const login=()=>{const k=lid.trim().toLowerCase();const u=users.find(u=>u.username.toLowerCase()===k||(u.phone&&u.phone===lid.trim().replace(/^(\+63|0)/,""))||(u.email&&u.email.toLowerCase()===k));if(!u||u.pw!==lpw)return setErr("Incorrect username or password.");setErr("");onIn(u)};
const send=c=>{setCh(c);setCode(gen8());setInp("");setBn(true);setErr("");setSt("code")};
const startPhone=()=>{if(!/^9\d{9}$/.test(ph))return setErr("Enter exactly 10 digits starting with 9 (e.g. 9163498336).");if(users.some(u=>u.phone===ph))return setErr("This phone number is already registered.");send("phone")};
const emailOk=()=>{const m=validEmail(em.trim());if(m){setErr(m);return false}if(users.some(u=>u.email&&u.email.toLowerCase()===em.trim().toLowerCase())){setErr("This email is already registered.");return false}return true};
const startEmail=pv=>{if(!emailOk())return;setProv(pv);send("email")};
const startApple=()=>{if(!emailOk())return;setProv("Apple");setCh("apple");setErr("");setSt("creds")};
const verify=()=>{if(inp===code){setErr("");setSt("creds")}else reset("Wrong verification code. For your security, registration was restarted. Please start again.")};
const unOk=/^[a-zA-Z0-9]{1,8}$/.test(un);const taken=un&&(RESERVED.includes(un.toLowerCase())||users.some(u=>u.username.toLowerCase()===un.toLowerCase()));
const pwErr=!pw?"":!/[A-Z]/.test(pw)?"Add at least 1 UPPERCASE letter.":!/[^A-Za-z0-9\s]/.test(pw)?"Add at least 1 special character (!@#$%^&*).":"";
const match=pw.length>0&&pw===pw2;const credOk=unOk&&!taken&&pw&&!pwErr&&match;
const finish=()=>{const u={username:un,pw,phone:ch==="phone"?ph:"",email:ch==="phone"?"":em.trim(),shop:shop.trim(),provider:prov};setUsers([...users,u]);onIn(u)};
const Btn=({children,onClick,dis,ghost})=><button disabled={dis} onClick={onClick} className={"btn w-full disabled:opacity-40 "+(ghost?"ghost":"text-white")} style={ghost?{}:G}>{children}</button>;
const Err=()=>err?<div className="text-sm text-red-500">{err}</div>:null;
const Back=()=><button className="text-sm mu" onClick={()=>reset("")}>← Back to sign-up options</button>;
return <div className="p-5 max-w-sm mx-auto pt-8">
{st==="code"&&ch==="phone"&&bn&&<div className="fixed top-2 left-2 right-2 z-[60] max-w-sm mx-auto rounded-2xl p-3 text-sm shadow-lg" style={{background:"#14161a",color:"#fff"}}><div className="flex justify-between text-xs" style={{opacity:.7}}><span>💬 Messages · now</span><button onClick={()=>setBn(false)}>✕</button></div><div className="mt-1">{msg8(code)}</div></div>}
<div className="text-center mb-5"><div className="text-5xl">🛍️</div><h1 className="text-2xl font-bold mt-2">A’s Negosyo POS</h1><p className="mu text-sm">POS at inventory para sa Pinoy sellers</p></div>
<div className="card p-4 space-y-3">
{st==="login"&&<><b>Log In</b><input className="inp" placeholder="Username, email or phone" value={lid} onChange={e=>setLid(e.target.value)}/><PwField label="Password" value={lpw} onChange={setLpw}/><Err/>
<Btn onClick={login}>Log In</Btn><Btn ghost onClick={()=>reset("")}>Create an account</Btn>
<button className="text-sm mu w-full" onClick={()=>onIn(null)}>Skip to demo store as {role}</button></>}
{st==="signup"&&<><b>Create your account</b><Err/>
<button className="btn ghost w-full" onClick={()=>{setErr("");setEm("");setSt("google")}}><b style={{color:"#4285F4"}}>G</b> Continue with Google</button>
<button className="btn ghost w-full" onClick={()=>{setErr("");setEm("");setSt("apple")}}>🍎 Continue with Apple ID</button>
<button className="btn ghost w-full" onClick={()=>{setErr("");setSt("phone")}}>📱 Sign Up with Phone Number (+63)</button>
<button className="btn ghost w-full" onClick={()=>{setErr("");setEm("");setSt("email")}}>✉️ Use Other Email</button>
<button className="text-sm mu w-full" onClick={()=>{setErr("");setSt("login")}}>Already have an account? Log In</button></>}
{(st==="google"||st==="apple")&&<><Back/><b>{st==="google"?"Google account":"Apple ID"}</b><p className="mu text-xs">Demo of <code>supabase.auth.signInWithOAuth({`{provider:"${st}"}`})</code>. Enter the account email to simulate the sign-in.</p>
<input className="inp" type="email" placeholder={st==="google"?"you@gmail.com":"you@icloud.com"} value={em} onChange={e=>setEm(e.target.value)}/><Err/>
<Btn onClick={()=>st==="google"?startEmail("Google"):startApple()}>{st==="google"?"Continue (email verification)":"Continue"}</Btn></>}
{st==="phone"&&<><Back/><b>Sign up with phone</b><div className="flex gap-2"><div className="inp flex items-center justify-center font-bold" style={{width:72}}>+63</div>
<input className="inp" inputMode="numeric" placeholder="9163498336" maxLength={10} value={ph} onChange={e=>{let v=e.target.value.replace(/\D/g,"").slice(0,10);if(v&&v[0]!=="9")v="";setPh(v)}}/></div>
<p className="mu text-xs">10 digits, starting with 9.</p><Err/><Btn onClick={startPhone}>Send 8-digit code</Btn></>}
{st==="email"&&<><Back/><b>Sign up with email</b><input className="inp" type="email" placeholder="you@example.com" value={em} onChange={e=>setEm(e.target.value)}/><p className="mu text-xs">Disposable or fake email addresses are blocked.</p><Err/><Btn onClick={()=>startEmail("Email")}>Send 8-digit code</Btn></>}
{st==="code"&&<><b>Enter the 8-digit code</b><p className="mu text-xs">Sent to {ch==="phone"?"+63 "+ph:em}. A wrong code restarts registration.</p>
{ch==="email"?<div className="card p-3 text-sm space-y-1"><div className="mu text-xs">✉️ Simulated email · demo mode</div><div className="text-xs">To: {em}</div><div className="text-xs">Subject: Your A’s Negosyo POS verification code</div><div className="pt-1">{msg8(code)}</div></div>:<p className="mu text-xs">📱 See the simulated SMS banner at the top of the screen.</p>}
<input className="inp" inputMode="numeric" maxLength={8} placeholder="8-digit code" value={inp} onChange={e=>setInp(e.target.value.replace(/\D/g,"").slice(0,8))}/><Err/>
<Btn dis={inp.length!==8} onClick={verify}>Verify</Btn><button className="text-sm mu w-full" onClick={()=>reset("")}>Start over</button></>}
{st==="creds"&&<><b>Create your username and password</b>
<div><div className="flex justify-between text-xs mu"><span>Username</span><span>{un.length}/8</span></div><input className="inp mt-1" maxLength={8} placeholder="Letters and numbers only" autoCapitalize="none" value={un} onChange={e=>setUn(e.target.value.replace(/[^a-zA-Z0-9]/g,""))}/>
<div className="text-xs mt-1" style={{color:taken?"#ef4444":unOk?"#0f9d6b":"var(--mu)"}}>{taken?"✗ Already taken. Try another.":unOk?"✓ Available":"Max 8 characters, no spaces or symbols."} The username is permanent and cannot be changed.</div></div>
<PwField label="Password" value={pw} onChange={setPw} maxLength={8}/>{pwErr&&<div className="text-xs text-red-500">{pwErr}</div>}
<PwField label="Confirm Password" value={pw2} onChange={setPw2} maxLength={8}/>{pw2&&!match&&<div className="text-xs text-red-500">Passwords do not match.</div>}
<p className="mu text-xs">Max 8 characters, with 1 uppercase letter and 1 special character.</p>
<Btn dis={!credOk} onClick={()=>setSt("shop")}>Continue</Btn></>}
{st==="shop"&&<><b>Set up your store</b><div><div className="flex justify-between text-xs mu"><span>Shop name</span><span>{shop.length}/30</span></div>
<input className="inp mt-1" maxLength={30} placeholder="e.g. Ate Mel Online Shop" value={shop} onChange={e=>setShop(e.target.value.slice(0,30))}/></div>
<Btn dis={!shop.trim()} onClick={finish}>Activate my A’s Negosyo POS store</Btn></>}
</div></div>;}
function Scanner({onCode,onClose,products}){const[sim,setSim]=useState("");const[err,setErr]=useState("");const ref=useRef();
useEffect(()=>{let s;try{s=new Html5Qrcode("reader");ref.current=s;
s.start({facingMode:"environment"},{fps:10,qrbox:220},t=>{onCode(t)},()=>{}).catch(e=>setErr("Camera unavailable: allow camera access or use a USB/Bluetooth scanner."));}catch(e){setErr("Scanner failed to load.")}
return()=>{try{ref.current&&ref.current.isScanning&&ref.current.stop().catch(()=>{})}catch(e){}}},[]);
return <Modal title="Scan QR / Barcode" onClose={onClose}><div id="reader" style={{width:"100%"}}></div>{err&&<p className="text-sm text-red-500 mt-2">{err}</p>}<p className="mu text-xs mt-2">Each scan adds 1 item matching the SKU.</p>
<div className="card p-3 mt-3 space-y-2"><b className="text-sm">Simulate Scan (demo)</b><div className="flex gap-2"><select className="inp" value={sim} onChange={e=>setSim(e.target.value)}><option value="">Choose a SKU…</option>{(products||[]).map(p=><option key={p.id} value={p.sku}>{p.sku} – {p.name}</option>)}</select>
<button className="btn text-white" style={{background:"#0f9d6b"}} disabled={!sim} onClick={()=>onCode(sim)}>Simulate Scan</button></div></div></Modal>;}

function Receipt({o,set,onClose}){const share=()=>{const t=`${set.name}\n${set.addr}\n${set.phone}\nOR #${o.id}\n`+o.items.map(i=>`${i.qty}x ${i.name} ${peso(i.price*i.qty)}`).join("\n")+`\nTOTAL ${peso(o.total)}\n${set.foot}`+(PLAN==="free"?"\nPowered by A’s Negosyo POS":"");
if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert("Receipt copied")}};
return <Modal title="Receipt" onClose={onClose}>
<div id="rcpt" className="text-sm text-center space-y-1" style={{fontFamily:"ui-monospace,monospace"}}>
<b style={{color:set.accent}} className="text-base">{set.name}</b><div>{set.addr}</div><div>{set.phone}</div><div className="mu">{set.tin}</div>
<div className="mu">OR #{o.id} · {o.time}</div><hr style={{borderColor:"var(--bd)"}}/>
{o.items.map(i=><div key={i.id} className="flex justify-between text-left"><span>{i.qty}× {i.name}</span><span>{peso(i.price*i.qty)}</span></div>)}
<hr style={{borderColor:"var(--bd)"}}/>
<div className="flex justify-between"><span>Subtotal</span><span>{peso(o.subtotal)}</span></div>
{o.discount>0&&<div className="flex justify-between"><span>Discount</span><span>-{peso(o.discount)}</span></div>}
<div className="flex justify-between font-bold text-base"><span>TOTAL</span><span>{peso(o.total)}</span></div>
<div className="flex justify-between"><span>{o.method}{o.ref?` · Ref ${o.ref}`:""}</span><span>{o.method==="Cash"?`Change ${peso(o.change)}`:""}</span></div>
<div className="pt-2">{set.foot}</div>
{PLAN==="free"&&<div className="mu text-xs pt-2">Powered by A’s Negosyo POS</div>}</div>
<div className="flex gap-2 mt-4"><button className="btn flex-1 text-white" style={{background:set.accent}} onClick={share}>Share</button><button className="btn flex-1 ghost" onClick={()=>window.print()}>Print</button></div></Modal>;}

function Checkout({total,set,onDone,onClose}){const[m,setM]=useState("Cash");const[cash,setCash]=useState("");const[ref,setRef]=useState("");
const change=Math.max(0,(+cash||0)-total);const ok=m==="Cash"?(+cash||0)>=total:ref.trim().length>3;
return <Modal title={"Pay "+peso(total)} onClose={onClose}>
<div className="flex gap-2 mb-3">{["Cash","QR Ph / GCash / Maya"].map(k=><button key={k} onClick={()=>setM(k)} className={"btn flex-1 text-xs "+(m===k?"text-white":"ghost")} style={m===k?{background:set.accent}:{}}>{k}</button>)}</div>
{m==="Cash"?<div className="space-y-2"><input className="inp" inputMode="decimal" placeholder="Cash received" value={cash} onChange={e=>setCash(e.target.value)}/>
<div className="flex gap-2 flex-wrap">{[total,100,500,1000].map((v,i)=><button key={i} className="btn ghost" onClick={()=>setCash(String(v))}>{i?peso(v):"Exact"}</button>)}</div>
<div className="card p-3 text-center"><div className="mu text-xs">CHANGE</div><div className="text-3xl font-bold">{peso(change)}</div></div></div>
:<div className="space-y-2 text-center">{set.qr?<img src={set.qr} alt="Seller payment QR" className="mx-auto rounded-lg" style={{maxHeight:260}}/>:<div className="card p-6 mu text-sm">No payment QR yet. Upload yours in Settings.</div>}
<p className="mu text-xs">Customer scans, pays {peso(total)}, then enter their reference no.</p>
<input className="inp" placeholder="Customer reference number" value={ref} onChange={e=>setRef(e.target.value)}/></div>}
<button disabled={!ok} className="btn w-full text-white mt-4 disabled:opacity-40" style={{background:set.accent}} onClick={()=>onDone({method:m,ref:m==="Cash"?"":ref,change})}>Confirm Payment</button></Modal>;}

function POS({products,setProducts,orders,setOrders,set,role}){
const[q,setQ]=useState("");const[cart,setCart]=useState([]);const[disc,setDisc]=useState("");const[scan,setScan]=useState(false);const[pay,setPay]=useState(false);const[rc,setRc]=useState(null);const[toast,setToast]=useState("");
const add=p=>{if(p.stock<=(cart.find(c=>c.id===p.id)?.qty||0)){setToast("Out of stock: "+p.name);return}
setCart(c=>c.find(x=>x.id===p.id)?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}])};
const bySku=code=>{const p=products.find(p=>[p.sku,p.shopee,p.lazada,p.tiktok].filter(Boolean).includes(code.trim()));if(p){add(p);setToast("Added "+p.name)}else setToast("SKU not found: "+code)};
useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(""),1800);return()=>clearTimeout(t)}},[toast]);
const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);const d=Math.min(+disc||0,sub);const total=sub-d;
const list=products.filter(p=>(p.name+p.sku).toLowerCase().includes(q.toLowerCase()));
const done=({method,ref,change})=>{const o={id:1000+orders.length+1,items:cart,subtotal:sub,discount:d,total,cogs:cart.reduce((a,c)=>a+c.cost*c.qty,0),method,ref,change,status:"New",time:new Date().toLocaleString("en-PH")};
setOrders([o,...orders]);setProducts(products.map(p=>{const c=cart.find(x=>x.id===p.id);return c?{...p,stock:p.stock-c.qty}:p}));setCart([]);setDisc("");setPay(false);setRc(o)};
return <div className="p-3 space-y-3">
<div className="flex gap-2"><input className="inp" placeholder="Search or type/scan SKU + Enter" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&q){bySku(q);setQ("")}}}/>
<button className="btn text-white" style={{background:set.accent}} onClick={()=>setScan(true)}>📷 Scan</button></div>
<div className="grid grid-cols-2 gap-2">{list.map(p=><button key={p.id} onClick={()=>add(p)} className="card p-3 text-left active:scale-95 transition">
<div className="text-2xl">{p.e}</div><div className="font-semibold text-sm leading-tight">{p.name}</div>
<div className="flex justify-between items-center mt-1"><b style={{color:set.accent}}>{peso(p.price)}</b><span className={"text-xs "+(p.stock<=5?"text-red-500":"mu")}>{p.stock} left</span></div></button>)}</div>
<div className="card p-3 space-y-2 mb-16"><b>Cart ({cart.reduce((a,c)=>a+c.qty,0)})</b>
{!cart.length&&<p className="mu text-sm">Tap a product to add.</p>}
{cart.map(c=><div key={c.id} className="flex items-center gap-2 text-sm"><span className="flex-1">{c.name}</span>
<button className="btn ghost px-3" onClick={()=>setCart(cart.map(x=>x.id===c.id?{...x,qty:x.qty-1}:x).filter(x=>x.qty>0))}>−</button><b>{c.qty}</b>
<button className="btn ghost px-3" onClick={()=>add(c)}>+</button><span className="w-20 text-right">{peso(c.price*c.qty)}</span></div>)}

{tab==="Inventory"&&<Inventory {...{products,setProducts,role,set,rank,up}}/>}
{tab==="Settings"&&!cash&&<Settings {...{set,setSet}}/>}
{tab==="Plans"&&!cash&&<PlansTab {...{plan,exp,rank,up}}/>}
{tab==="Admin"&&role==="Super Admin"&&<Admin {...{stores:stores.map(x=>x.id==="me"?{...x,name:set.name}:x),setStores,payments,setPayments,adminQr,setAdminQr}}/>}
{upg!==null&&<Upgrade {...{reason:upg,onClose:()=>setUpg(null),store:set.name,rank,payments,setPayments,adminQr}}/>}
<nav className="fixed bottom-0 left-0 right-0 z-40" style={{background:"var(--card)",borderTop:"1px solid var(--bd)",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
<div className="max-w-xl mx-auto flex">{tabs.map(([t,i])=><button key={t} onClick={()=>setTab(t)} className="flex-1 py-2 text-xs" style={{color:tab===t?set.accent:"var(--mu)",fontWeight:tab===t?700:400}}><div className="text-lg">{i}</div>{t}</button>)}</div></nav></>}
</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
